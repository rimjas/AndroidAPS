name: Clojure CI

on:
  push:
    branches: [ "3.4.2.6+aisf3.2.1" ]
  pull_request:
    branches: [ "3.4.2.6+aisf3.2.1" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Install dependencies
      run: lein deps
    - name: Run tests
      run: lein test
